name: Verify Mosaic

on:
  push:
  pull_request:

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Test with enforced coverage
        run: uv run pytest --cov=mosaic --cov-report=term-missing --cov-fail-under=99
      - name: Verify intentional critical verdict
        shell: bash
        run: |
          set +e
          uv run mosaic demo --json
          code=$?
          set -e
          test "$code" -eq 3
