name: Mosaic privacy gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  compositional-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Fail the PR on critical compositional privacy risk
        run: uv run mosaic check --fail-on critical
