services:
  mosaic:
    build: .
    ports:
      - "8123:8123"
    environment:
      MOSAIC_PUBLIC_DEMO: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

